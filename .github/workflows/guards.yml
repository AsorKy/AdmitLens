name: guards

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: tools/guards/uv.lock
      - run: make setup
      # Detection first: a red test suite must never hide a leak, and both always run.
      - run: make secrets-scan
      - if: ${{ !cancelled() }}
        run: make guards-test
